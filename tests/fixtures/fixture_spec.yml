# Synthetic fixture for CI. Same table and column names as the real-data load.
# pk / fk / cast describe the tables for staging and tests; the generator ignores them.
seed: 1919
tables:
  - name: demand
    grid: {start: "2025-01-01 00:00:00", end: "2025-03-31 23:30:00", freq: 30min, column: settlement_ts}
    pk: settlement_ts
    columns:
      demand_mw: {type: expr, expr: "np.round(30000 + 6000 * np.sin(2 * np.pi * (df.settlement_ts.dt.hour + df.settlement_ts.dt.minute / 60 - 6) / 24) - 2500 * (df.settlement_ts.dt.dayofweek >= 5) + rng.normal(0, 800, n), 1)"}
  - name: weather
    grid: {start: 2025-01-01, end: 2025-03-31, freq: D, column: weather_date}
    pk: weather_date
    cast: {weather_date: date}
    columns:
      temp_c: {type: float, low: -2, high: 14, decimals: 1}
