version: 2
models:
  - name: stg_demand
    data_tests:
      - unique_combination:
          arguments:
            columns: [settlement_date, settlement_period]
    columns:
      - name: nd_mw
        data_tests: [not_null]
      - name: period_start_utc
        data_tests: [unique, not_null]
  - name: stg_weather
    columns:
      - name: hour_utc
        data_tests: [unique, not_null]
