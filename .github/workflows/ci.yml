name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fixture pipeline (dbt -> walk-forward backtest -> one daily DAG run, offline -> tests)
        run: make fixture-all
